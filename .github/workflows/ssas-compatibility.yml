name: SSAS compatibility

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validate media, Phase C/D/E (Tabular), Phase F (Multidimensional), Phase G/G2/H (processing), or the experimental full matrix
        type: choice
        required: true
        default: media-only
        options:
          - media-only
          - phase-c
          - phase-d
          - phase-e
          - phase-f
          - phase-g
          - phase-g2
          - phase-h
          - full-matrix
      media_urls_json:
        description: JSON map of SQL Server version to direct public Microsoft installation ISO URL
        type: string
        required: true
        default: '{"2017":"","2019":"https://download.microsoft.com/download/8/4/c/84c6c430-e0f5-476d-bf43-eaaa222a72e0/SQLServer2019-x64-ENU-Dev.iso","2022":"https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLServer2022-x64-ENU-Dev.iso","2025":"https://download.microsoft.com/download/dea8c210-c44a-4a9d-9d80-0c81578860c5/ENU/SQLServer2025-x64-ENU-EntDev.iso"}'

permissions:
  contents: read

jobs:
  ssas-compatibility:
    name: SQL Server ${{ matrix.ssas_version }} ${{ matrix.mode }} + SSMS ${{ matrix.ssms_major }}
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.scope == 'phase-g2' && 1 || 256 }}
      matrix: ${{ fromJSON(inputs.scope == 'full-matrix' && '{"ssas_version":["2017","2019","2022","2025"],"mode":["Tabular","Multidimensional"],"ssms_major":["20","22"]}' || inputs.scope == 'phase-h' && '{"include":[{"ssas_version":"2022","mode":"Tabular","ssms_major":"22"}]}' || inputs.scope == 'phase-g2' && '{"include":[{"ssas_version":"2019","mode":"Multidimensional","ssms_major":"22"},{"ssas_version":"2025","mode":"Multidimensional","ssms_major":"22"}]}' || inputs.scope == 'phase-g' && '{"include":[{"ssas_version":"2022","mode":"Multidimensional","ssms_major":"22"}]}' || inputs.scope == 'phase-f' && '{"ssas_version":["2019","2022","2025"],"mode":["Multidimensional"],"ssms_major":["22"]}' || inputs.scope == 'phase-e' && '{"ssas_version":["2019","2025"],"mode":["Tabular"],"ssms_major":["22"]}' || inputs.scope == 'phase-d' && '{"ssas_version":["2022"],"mode":["Tabular"],"ssms_major":["20","21","22"]}' || '{"include":[{"ssas_version":"2022","mode":"Tabular","ssms_major":"20"}]}') }}
    env:
      COMPAT_MEDIA_URLS_JSON: ${{ inputs.media_urls_json }}
      COMPAT_SSAS_VERSION: ${{ matrix.ssas_version }}
      COMPAT_SSAS_MODE: ${{ matrix.mode }}
      COMPAT_SSMS_MAJOR: ${{ matrix.ssms_major }}
      ARTIFACT_DIRECTORY: artifacts/ssas/${{ matrix.ssas_version }}/${{ matrix.mode }}/ssms-${{ matrix.ssms_major }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Capture runner diagnostics
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIRECTORY -Force | Out-Null
          ./test/infrastructure/Get-RunnerDiagnostics.ps1 -OutputPath "$env:ARTIFACT_DIRECTORY/runner-diagnostics.json"

      - name: Acquire SQL Server installation media
        id: acquire-media
        timeout-minutes: 22
        shell: powershell
        run: |
          $mediaMap = ConvertFrom-Json -InputObject $env:COMPAT_MEDIA_URLS_JSON -ErrorAction Stop
          $mediaUri = [uri][string]$mediaMap.PSObject.Properties[$env:COMPAT_SSAS_VERSION].Value
          ./test/infrastructure/Acquire-SqlServerMedia.ps1 `
            -MediaUri $mediaUri `
            -MediaDirectory "$env:RUNNER_TEMP/DeployCube-sql-media" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/media" `
            -TimeoutMinutes 20 -InactivityTimeoutSeconds 60

      - name: Test infrastructure guards
        if: success() && (inputs.scope == 'media-only' || inputs.scope == 'phase-d' || inputs.scope == 'phase-e' || inputs.scope == 'phase-f' || inputs.scope == 'phase-g' || inputs.scope == 'phase-g2' || inputs.scope == 'phase-h')
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.7.1' })) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -ErrorAction Stop
          }
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
          $configuration = New-PesterConfiguration
          $testPaths = @('test/SqlServerMedia.Tests.ps1', 'test/SqlServerMediaDownload.Tests.ps1', 'test/BoundedProcess.Tests.ps1')
          if ('${{ inputs.scope }}' -in @('phase-d', 'phase-e', 'phase-f')) {
            $testPaths += @('test/DeploymentToolSelection.Tests.ps1', 'test/DeploymentUtilityCompatibility.Tests.ps1')
          }
          if ('${{ inputs.scope }}' -in @('phase-e', 'phase-f')) {
            $testPaths += 'test/SsasProvisioningVerification.Tests.ps1'
          }
          if ('${{ inputs.scope }}' -eq 'phase-f') {
            $testPaths += 'test/MultidimensionalMetadata.Tests.ps1'
          }
          if ('${{ inputs.scope }}' -in @('phase-g', 'phase-g2')) {
            $testPaths += @('test/DeploymentUtilityCompatibility.Tests.ps1', 'test/MultidimensionalMetadata.Tests.ps1', 'test/SsasProcessingEvidence.Tests.ps1', 'test/SsasProvisioningVerification.Tests.ps1')
          }
          if ('${{ inputs.scope }}' -eq 'phase-h') {
            $testPaths += @('test/DeploymentToolSelection.Tests.ps1', 'test/DeploymentUtilityCompatibility.Tests.ps1', 'test/SsasProcessingEvidence.Tests.ps1', 'test/SsasProvisioningVerification.Tests.ps1', 'test/TabularProcessingEvidence.Tests.ps1')
          }
          $configuration.Run.Path = $testPaths
          $configuration.Run.PassThru = $true
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = "$env:ARTIFACT_DIRECTORY/media/nunit-media.xml"
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -ne 0 -or $result.PassedCount -eq 0) { throw 'Infrastructure guard regression tests failed.' }

      - name: Mount and validate SQL Server media
        id: validate-media
        timeout-minutes: 5
        shell: powershell
        env:
          ISO_PATH: ${{ steps.acquire-media.outputs.iso-path }}
        run: |
          ./test/infrastructure/Mount-SqlServerMedia.ps1 `
            -IsoPath $env:ISO_PATH -SsasVersion $env:COMPAT_SSAS_VERSION `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/media"

      - name: Install SSMS ${{ matrix.ssms_major }}
        id: install-ssms
        if: success() && inputs.scope != 'media-only'
        timeout-minutes: 30
        shell: powershell
        run: |
          $logDirectory = "$env:ARTIFACT_DIRECTORY/ssms-installation"
          if ('${{ inputs.scope }}' -in @('phase-d', 'phase-e', 'phase-f', 'phase-g', 'phase-g2', 'phase-h')) {
            $logDirectory = Join-Path $env:RUNNER_TEMP "ssms-$env:COMPAT_SSMS_MAJOR-logs"
          }
          try {
            ./test/infrastructure/Install-Ssms.ps1 `
              -SsmsMajor $env:COMPAT_SSMS_MAJOR `
              -LogDirectory $logDirectory `
              -MinimumFreeSpaceGB 8
          }
          finally {
            if ('${{ inputs.scope }}' -in @('phase-d', 'phase-e', 'phase-f', 'phase-g', 'phase-g2', 'phase-h') -and (Test-Path -LiteralPath $logDirectory)) {
              New-Item -ItemType Directory -Path "$env:ARTIFACT_DIRECTORY/ssms-installation" -Force | Out-Null
              Copy-Item -Path (Join-Path $logDirectory '*') -Destination "$env:ARTIFACT_DIRECTORY/ssms-installation" -Recurse -Force -ErrorAction Stop
            }
          }

      - name: Capture SSMS installer failure events
        if: always() && steps.install-ssms.outcome == 'failure'
        shell: powershell
        run: |
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddHours(-1) } -ErrorAction Stop |
            Where-Object { $_.ProviderName -match '\.NET Runtime|Application Error|Windows Error Reporting|MsiInstaller' } |
            Select-Object -First 200 TimeCreated, ProviderName, Id, LevelDisplayName, Message
          $events | Export-Clixml -LiteralPath "$env:ARTIFACT_DIRECTORY/ssms-installer-events.xml"

      - name: Install SSAS ${{ matrix.ssas_version }} ${{ matrix.mode }}
        id: install-ssas
        if: success() && inputs.scope != 'media-only'
        timeout-minutes: 140
        shell: powershell
        env:
          SQL_MEDIA_ROOT: ${{ steps.validate-media.outputs.media-root }}
        run: |
          ./test/infrastructure/Install-Ssas.ps1 `
            -SsasVersion $env:COMPAT_SSAS_VERSION -Mode $env:COMPAT_SSAS_MODE `
            -MediaRoot $env:SQL_MEDIA_ROOT `
            -MediaAcquisitionReportPath "$env:ARTIFACT_DIRECTORY/media/media-acquisition.json" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/sql-setup" `
            -MinimumFreeSpaceGB 16 -SetupTimeoutMinutes 120 -ServiceReadinessTimeoutMinutes 15

      - name: Verify SSAS service, version and mode
        id: verify-ssas
        if: success() && inputs.scope != 'media-only'
        timeout-minutes: 10
        shell: powershell
        run: |
          ./test/infrastructure/Verify-SsasInstallation.ps1 `
            -SsasVersion $env:COMPAT_SSAS_VERSION -Mode $env:COMPAT_SSAS_MODE `
            -InstallationReportPath "$env:ARTIFACT_DIRECTORY/sql-setup/ssas-install.json" `
            -ReportPath "$env:ARTIFACT_DIRECTORY/ssas-verification.json" `
            -LogPath "$env:ARTIFACT_DIRECTORY/sql-setup/ssas-verification.log"

      - name: Acquire SQL Server 2022 Developer source media
        id: acquire-source-media
        if: success() && inputs.scope == 'phase-g2'
        timeout-minutes: 22
        shell: powershell
        run: |
          ./test/infrastructure/Acquire-SqlServerMedia.ps1 `
            -MediaUri 'https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLServer2022-x64-ENU-Dev.iso' `
            -MediaDirectory "$env:RUNNER_TEMP/DeployCube-source-sql-media" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/processing-source-media" `
            -TimeoutMinutes 20 -InactivityTimeoutSeconds 60

      - name: Mount and validate SQL Server 2022 source media
        id: validate-source-media
        if: success() && inputs.scope == 'phase-g2'
        timeout-minutes: 5
        shell: powershell
        env:
          SOURCE_ISO_PATH: ${{ steps.acquire-source-media.outputs.iso-path }}
        run: |
          ./test/infrastructure/Mount-SqlServerMedia.ps1 `
            -IsoPath $env:SOURCE_ISO_PATH -SsasVersion 2022 `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/processing-source-media"

      - name: Create isolated Multidimensional fixture source
        if: success() && inputs.scope != 'media-only' && inputs.scope != 'phase-g' && matrix.mode == 'Multidimensional'
        timeout-minutes: 5
        shell: powershell
        run: |
          ./test/infrastructure/Initialize-MultidimensionalSource.ps1 -LogDirectory "$env:ARTIFACT_DIRECTORY/fixture-source"

      - name: Probe Deployment Utility compatibility
        id: utility-probe
        if: success() && inputs.scope != 'media-only' && inputs.scope != 'phase-g' && inputs.scope != 'phase-h'
        timeout-minutes: 10
        shell: powershell
        run: |
          ./test/infrastructure/Invoke-SsasCompatibility.ps1 `
            -SsasVersion $env:COMPAT_SSAS_VERSION -Mode $env:COMPAT_SSAS_MODE -SsmsMajor $env:COMPAT_SSMS_MAJOR `
            -ReportPath "$env:ARTIFACT_DIRECTORY/compatibility-report.json" `
            -TestResultPath "$env:ARTIFACT_DIRECTORY/nunit-results.xml" `
            -DiagnosticsPath "$env:ARTIFACT_DIRECTORY/runner-diagnostics.json" `
            -SsmsInstallationReportPath "$env:ARTIFACT_DIRECTORY/ssms-installation/ssms-$env:COMPAT_SSMS_MAJOR-install.json" `
            -SsasInstallationReportPath "$env:ARTIFACT_DIRECTORY/sql-setup/ssas-install.json" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/model-build" -ProbeOnly

      - name: Run DeployCube SSAS integration tests
        if: success() && inputs.scope != 'media-only' && inputs.scope != 'phase-g' && inputs.scope != 'phase-h' && steps.utility-probe.outcome == 'success'
        timeout-minutes: 10
        shell: powershell
        run: |
          ./test/infrastructure/Invoke-SsasCompatibility.ps1 `
            -SsasVersion $env:COMPAT_SSAS_VERSION -Mode $env:COMPAT_SSAS_MODE -SsmsMajor $env:COMPAT_SSMS_MAJOR `
            -ReportPath "$env:ARTIFACT_DIRECTORY/compatibility-report.json" `
            -TestResultPath "$env:ARTIFACT_DIRECTORY/nunit-results.xml" `
            -DiagnosticsPath "$env:ARTIFACT_DIRECTORY/runner-diagnostics.json" `
            -SsmsInstallationReportPath "$env:ARTIFACT_DIRECTORY/ssms-installation/ssms-$env:COMPAT_SSMS_MAJOR-install.json" `
            -SsasInstallationReportPath "$env:ARTIFACT_DIRECTORY/sql-setup/ssas-install.json" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/model-build" -RequireExistingUtilityProbe

      - name: Provision isolated SQL Engine processing source
        id: processing-source
        if: success() && (inputs.scope == 'phase-g' || inputs.scope == 'phase-g2' || inputs.scope == 'phase-h')
        timeout-minutes: 25
        shell: powershell
        env:
          SQL_MEDIA_ROOT: ${{ inputs.scope == 'phase-g2' && steps.validate-source-media.outputs.media-root || steps.validate-media.outputs.media-root }}
        run: |
          ./test/infrastructure/Initialize-ProcessingSource.ps1 `
            -MediaRoot $env:SQL_MEDIA_ROOT -LogDirectory "$env:ARTIFACT_DIRECTORY/processing-source"

      - name: Deploy, process, query and test isolated processing failures
        id: processing-tests
        if: success() && (inputs.scope == 'phase-g' || inputs.scope == 'phase-g2')
        timeout-minutes: 12
        shell: powershell
        run: |
          . ./test/infrastructure/Invoke-BoundedProcess.ps1
          function Write-ProvisioningLog { param([string]$Stage, [string]$Message) Write-Host "[$Stage] $Message" }
          $script = (Resolve-Path ./test/infrastructure/Invoke-SsasProcessingCompatibility.ps1).Path
          $logs = [IO.Path]::GetFullPath("$env:ARTIFACT_DIRECTORY/processing")
          New-Item -ItemType Directory -Path $logs -Force | Out-Null
          $source = [IO.Path]::GetFullPath("$env:ARTIFACT_DIRECTORY/processing-source/source-provisioning.json")
          $result = Invoke-BoundedProcess -FilePath "$PSHOME/powershell.exe" `
            -ArgumentList @('-NoLogo', '-NoProfile', '-NonInteractive', '-File', "`"$script`"", '-LogDirectory', "`"$logs`"", '-SourceReportPath', "`"$source`"", '-SsasVersion', $env:COMPAT_SSAS_VERSION) `
            -TimeoutSeconds 600 -Stage 'Phase G processing' `
            -StandardOutputPath "$logs/harness.stdout.log" -StandardErrorPath "$logs/harness.stderr.log"
          if ($result.ExitCode -ne 0) { throw "Phase G processing failed with exit $($result.ExitCode); inspect processing-report.json and harness logs." }

      - name: Verify fallback SSAS cleanup
        if: always() && (inputs.scope == 'phase-g' || inputs.scope == 'phase-g2') && steps.processing-tests.outcome != 'skipped'
        timeout-minutes: 5
        shell: powershell
        run: |
          ./test/infrastructure/Invoke-SsasProcessingCompatibility.ps1 `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/processing" `
            -SourceReportPath "$env:ARTIFACT_DIRECTORY/processing-source/source-provisioning.json" `
            -SsasVersion $env:COMPAT_SSAS_VERSION -CleanupOnly

      - name: Clean up isolated SQL source
        if: always() && (inputs.scope == 'phase-g' || inputs.scope == 'phase-g2') && (steps.processing-source.outcome == 'success' || steps.processing-source.outcome == 'failure' || steps.processing-source.outcome == 'cancelled')
        timeout-minutes: 5
        shell: powershell
        run: |
          ./test/infrastructure/Initialize-ProcessingSource.ps1 -Cleanup -LogDirectory "$env:ARTIFACT_DIRECTORY/processing-source"

      - name: Record complete Phase G outcome
        if: always() && (inputs.scope == 'phase-g' || inputs.scope == 'phase-g2')
        shell: powershell
        run: |
          $reports = @{}
          foreach ($entry in @(
            @{ Key = 'Source'; Path = 'processing-source/source-provisioning.json' },
            @{ Key = 'Processing'; Path = 'processing/processing-report.json' },
            @{ Key = 'SourceCleanup'; Path = 'processing-source/source-cleanup.json' }
          )) {
            $path = Join-Path $env:ARTIFACT_DIRECTORY $entry.Path
            $reports[$entry.Key] = if (Test-Path -LiteralPath $path) { Get-Content -LiteralPath $path -Raw | ConvertFrom-Json } else { @{ Outcome = 'Not tested' } }
          }
          $reports.RunUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $reports.SsasVersion = $env:COMPAT_SSAS_VERSION
          $reports.Outcome = if ($reports.Source.Outcome -ne 'Passed') { 'Blocked by infrastructure' } elseif ($reports.Processing.Outcome -eq 'Passed' -and $reports.SourceCleanup.Outcome -eq 'Passed') { 'Passed' } else { 'Failed' }
          $reports | ConvertTo-Json -Depth 15 | Set-Content -LiteralPath "$env:ARTIFACT_DIRECTORY/phase-g-report.json" -Encoding UTF8
          "Phase $('${{ inputs.scope }}'.ToUpperInvariant()): $($reports.Outcome); see phase-g-report.json for deployment, processing, MDX, negative tests and cleanup." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($reports.Outcome -ne 'Passed') { throw "Phase G outcome: $($reports.Outcome)" }

      - name: Deploy, process, query and test isolated Tabular model
        id: tabular-processing-tests
        if: success() && inputs.scope == 'phase-h'
        timeout-minutes: 18
        shell: powershell
        run: |
          . ./test/infrastructure/Invoke-BoundedProcess.ps1
          function Write-ProvisioningLog { param([string]$Stage, [string]$Message) Write-Host "[$Stage] $Message" }
          $script = (Resolve-Path ./test/infrastructure/Invoke-SsasTabularProcessing.ps1).Path
          $logs = [IO.Path]::GetFullPath("$env:ARTIFACT_DIRECTORY/tabular-processing")
          New-Item -ItemType Directory -Path $logs -Force | Out-Null
          $source = [IO.Path]::GetFullPath("$env:ARTIFACT_DIRECTORY/processing-source/source-provisioning.json")
          $result = Invoke-BoundedProcess -FilePath "$PSHOME/powershell.exe" `
            -ArgumentList @('-NoLogo', '-NoProfile', '-NonInteractive', '-File', "`"$script`"", '-LogDirectory', "`"$logs`"", '-SourceReportPath', "`"$source`"") `
            -TimeoutSeconds 900 -Stage 'Phase H Tabular processing' `
            -StandardOutputPath "$logs/harness.stdout.log" -StandardErrorPath "$logs/harness.stderr.log"
          if ($result.ExitCode -ne 0) { throw "Phase H Tabular processing failed with exit $($result.ExitCode); inspect tabular-processing-report.json and harness logs." }

      - name: Verify fallback Tabular cleanup
        if: always() && inputs.scope == 'phase-h' && steps.tabular-processing-tests.outcome != 'skipped'
        timeout-minutes: 5
        shell: powershell
        run: |
          ./test/infrastructure/Invoke-SsasTabularProcessing.ps1 `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/tabular-processing" `
            -SourceReportPath "$env:ARTIFACT_DIRECTORY/processing-source/source-provisioning.json" `
            -CleanupOnly

      - name: Clean up isolated Tabular SQL source
        if: always() && inputs.scope == 'phase-h' && (steps.processing-source.outcome == 'success' || steps.processing-source.outcome == 'failure' || steps.processing-source.outcome == 'cancelled')
        timeout-minutes: 5
        shell: powershell
        run: |
          ./test/infrastructure/Initialize-ProcessingSource.ps1 -Cleanup -LogDirectory "$env:ARTIFACT_DIRECTORY/processing-source"

      - name: Record complete Phase H outcome
        if: always() && inputs.scope == 'phase-h'
        shell: powershell
        run: |
          $reports = @{}
          foreach ($entry in @(
            @{ Key = 'Source'; Path = 'processing-source/source-provisioning.json' },
            @{ Key = 'Processing'; Path = 'tabular-processing/tabular-processing-report.json' },
            @{ Key = 'SourceCleanup'; Path = 'processing-source/source-cleanup.json' }
          )) {
            $path = Join-Path $env:ARTIFACT_DIRECTORY $entry.Path
            $reports[$entry.Key] = if (Test-Path -LiteralPath $path) { Get-Content -LiteralPath $path -Raw | ConvertFrom-Json } else { @{ Outcome = 'Not tested' } }
          }
          $reports.RunUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $reports.SsasVersion = $env:COMPAT_SSAS_VERSION
          $reports.SsasMode = $env:COMPAT_SSAS_MODE
          $reports.SsmsMajor = $env:COMPAT_SSMS_MAJOR
          $processingPassed = $reports.Processing.Outcome -eq 'Passed' -and
            $reports.Processing.PublishCube -eq 'Passed' -and $reports.Processing.Processing -eq 'Passed' -and
            $reports.Processing.DaxOutcome -eq 'Passed' -and $reports.Processing.DaxResult -eq 10 -and
            $reports.Processing.NegativeTests.Count -eq 2 -and $reports.Processing.Cleanup -eq 'Passed'
          $reports.Outcome = if ($reports.Source.Outcome -ne 'Passed') { 'Blocked by infrastructure' } elseif ($processingPassed -and $reports.SourceCleanup.Outcome -eq 'Passed') { 'Passed' } else { 'Failed' }
          $reports | ConvertTo-Json -Depth 18 | Set-Content -LiteralPath "$env:ARTIFACT_DIRECTORY/phase-h-report.json" -Encoding UTF8
          "Phase H: $($reports.Outcome); see phase-h-report.json for deployment, processing, DAX, negative tests and cleanup." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($reports.Outcome -ne 'Passed') { throw "Phase H outcome: $($reports.Outcome)" }

      - name: Capture SSAS provisioning diagnostics
        if: always() && inputs.scope != 'media-only' && (failure() || cancelled())
        shell: powershell
        run: |
          ./test/infrastructure/Get-SsasProvisioningDiagnostics.ps1 `
            -OutputPath "$env:ARTIFACT_DIRECTORY/sql-setup/runner-provisioning-diagnostics.json"

      - name: Dismount installation media
        if: always() && steps.acquire-media.outcome == 'success'
        shell: powershell
        env:
          ISO_PATH: ${{ steps.acquire-media.outputs.iso-path }}
        run: |
          $image = Get-DiskImage -ImagePath $env:ISO_PATH -ErrorAction Stop
          if ($image.Attached) { Dismount-DiskImage -ImagePath $env:ISO_PATH -ErrorAction Stop }
          Remove-Item -LiteralPath $env:ISO_PATH -Force -ErrorAction Stop

      - name: Dismount SQL Server 2022 source media
        if: always() && inputs.scope == 'phase-g2' && steps.acquire-source-media.outcome == 'success'
        shell: powershell
        env:
          SOURCE_ISO_PATH: ${{ steps.acquire-source-media.outputs.iso-path }}
        run: |
          $image = Get-DiskImage -ImagePath $env:SOURCE_ISO_PATH -ErrorAction Stop
          if ($image.Attached) { Dismount-DiskImage -ImagePath $env:SOURCE_ISO_PATH -ErrorAction Stop }
          Remove-Item -LiteralPath $env:SOURCE_ISO_PATH -Force -ErrorAction Stop

      - name: Upload SQL setup logs, reports and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssas-${{ matrix.ssas_version }}-${{ matrix.mode }}-ssms-${{ matrix.ssms_major }}
          path: ${{ env.ARTIFACT_DIRECTORY }}
          if-no-files-found: warn
          retention-days: 30
