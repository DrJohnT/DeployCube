name: SSAS compatibility

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validate media, run Phase C (SSMS 20), Phase D (SSMS 20/21/22), or the experimental full matrix
        type: choice
        required: true
        default: media-only
        options:
          - media-only
          - phase-c
          - phase-d
          - full-matrix
      media_urls_json:
        description: JSON map of SQL Server version to direct public Microsoft installation ISO URL
        type: string
        required: true
        default: '{"2017":"","2019":"","2022":"https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLServer2022-x64-ENU-Dev.iso","2025":""}'

permissions:
  contents: read

jobs:
  ssas-compatibility:
    name: SQL Server ${{ matrix.ssas_version }} ${{ matrix.mode }} + SSMS ${{ matrix.ssms_major }}
    runs-on: windows-2022
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.scope == 'full-matrix' && '{"ssas_version":["2017","2019","2022","2025"],"mode":["Tabular","Multidimensional"],"ssms_major":["20","22"]}' || inputs.scope == 'phase-d' && '{"ssas_version":["2022"],"mode":["Tabular"],"ssms_major":["20","21","22"]}' || '{"include":[{"ssas_version":"2022","mode":"Tabular","ssms_major":"20"}]}') }}
    env:
      COMPAT_MEDIA_URLS_JSON: ${{ inputs.media_urls_json }}
      COMPAT_SSAS_VERSION: ${{ matrix.ssas_version }}
      COMPAT_SSAS_MODE: ${{ matrix.mode }}
      COMPAT_SSMS_MAJOR: ${{ matrix.ssms_major }}
      ARTIFACT_DIRECTORY: artifacts/ssas/${{ matrix.ssas_version }}/${{ matrix.mode }}/ssms-${{ matrix.ssms_major }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Capture runner diagnostics
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIRECTORY -Force | Out-Null
          ./test/infrastructure/Get-RunnerDiagnostics.ps1 -OutputPath "$env:ARTIFACT_DIRECTORY/runner-diagnostics.json"

      - name: Acquire SQL Server installation media
        id: acquire-media
        timeout-minutes: 22
        shell: powershell
        run: |
          $mediaMap = ConvertFrom-Json -InputObject $env:COMPAT_MEDIA_URLS_JSON -ErrorAction Stop
          $mediaUri = [uri][string]$mediaMap.PSObject.Properties[$env:COMPAT_SSAS_VERSION].Value
          ./test/infrastructure/Acquire-SqlServerMedia.ps1 `
            -MediaUri $mediaUri `
            -MediaDirectory "$env:RUNNER_TEMP/DeployCube-sql-media" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/media" `
            -TimeoutMinutes 20 -InactivityTimeoutSeconds 60

      - name: Test infrastructure guards
        if: success() && (inputs.scope == 'media-only' || inputs.scope == 'phase-d')
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -eq [version]'5.7.1' })) {
            Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -ErrorAction Stop
          }
          Import-Module Pester -RequiredVersion 5.7.1 -ErrorAction Stop
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = @('test/SqlServerMedia.Tests.ps1', 'test/SqlServerMediaDownload.Tests.ps1', 'test/BoundedProcess.Tests.ps1')
          if ('${{ inputs.scope }}' -eq 'phase-d') {
            $configuration.Run.Path += @('test/DeploymentToolSelection.Tests.ps1', 'test/DeploymentUtilityCompatibility.Tests.ps1')
          }
          $configuration.Run.PassThru = $true
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = "$env:ARTIFACT_DIRECTORY/media/nunit-media.xml"
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -ne 0 -or $result.PassedCount -eq 0) { throw 'Infrastructure guard regression tests failed.' }

      - name: Mount and validate SQL Server media
        id: validate-media
        timeout-minutes: 5
        shell: powershell
        env:
          ISO_PATH: ${{ steps.acquire-media.outputs.iso-path }}
        run: |
          ./test/infrastructure/Mount-SqlServerMedia.ps1 `
            -IsoPath $env:ISO_PATH -SsasVersion $env:COMPAT_SSAS_VERSION `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/media"

      - name: Install SSMS ${{ matrix.ssms_major }}
        id: install-ssms
        if: success() && inputs.scope != 'media-only'
        timeout-minutes: 30
        shell: powershell
        run: |
          ./test/infrastructure/Install-Ssms.ps1 `
            -SsmsMajor $env:COMPAT_SSMS_MAJOR `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/ssms-installation" `
            -MinimumFreeSpaceGB 8

      - name: Install SSAS ${{ matrix.ssas_version }} ${{ matrix.mode }}
        id: install-ssas
        if: success() && inputs.scope != 'media-only'
        timeout-minutes: 140
        shell: powershell
        env:
          SQL_MEDIA_ROOT: ${{ steps.validate-media.outputs.media-root }}
        run: |
          ./test/infrastructure/Install-Ssas.ps1 `
            -SsasVersion $env:COMPAT_SSAS_VERSION -Mode $env:COMPAT_SSAS_MODE `
            -MediaRoot $env:SQL_MEDIA_ROOT `
            -MediaAcquisitionReportPath "$env:ARTIFACT_DIRECTORY/media/media-acquisition.json" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/sql-setup" `
            -MinimumFreeSpaceGB 16 -SetupTimeoutMinutes 120 -ServiceReadinessTimeoutMinutes 15

      - name: Verify SSAS service, version and mode
        id: verify-ssas
        if: success() && inputs.scope != 'media-only'
        timeout-minutes: 10
        shell: powershell
        run: |
          ./test/infrastructure/Verify-SsasInstallation.ps1 `
            -SsasVersion $env:COMPAT_SSAS_VERSION -Mode $env:COMPAT_SSAS_MODE `
            -InstallationReportPath "$env:ARTIFACT_DIRECTORY/sql-setup/ssas-install.json" `
            -ReportPath "$env:ARTIFACT_DIRECTORY/ssas-verification.json" `
            -LogPath "$env:ARTIFACT_DIRECTORY/sql-setup/ssas-verification.log"

      - name: Probe Deployment Utility compatibility
        id: utility-probe
        if: success() && inputs.scope != 'media-only'
        timeout-minutes: 10
        shell: powershell
        run: |
          ./test/infrastructure/Invoke-SsasCompatibility.ps1 `
            -SsasVersion $env:COMPAT_SSAS_VERSION -Mode $env:COMPAT_SSAS_MODE -SsmsMajor $env:COMPAT_SSMS_MAJOR `
            -ReportPath "$env:ARTIFACT_DIRECTORY/compatibility-report.json" `
            -TestResultPath "$env:ARTIFACT_DIRECTORY/nunit-results.xml" `
            -DiagnosticsPath "$env:ARTIFACT_DIRECTORY/runner-diagnostics.json" `
            -SsmsInstallationReportPath "$env:ARTIFACT_DIRECTORY/ssms-installation/ssms-$env:COMPAT_SSMS_MAJOR-install.json" `
            -SsasInstallationReportPath "$env:ARTIFACT_DIRECTORY/sql-setup/ssas-install.json" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/model-build" -ProbeOnly

      - name: Run DeployCube SSAS integration tests
        if: success() && inputs.scope != 'media-only' && steps.utility-probe.outcome == 'success'
        timeout-minutes: 10
        shell: powershell
        run: |
          ./test/infrastructure/Invoke-SsasCompatibility.ps1 `
            -SsasVersion $env:COMPAT_SSAS_VERSION -Mode $env:COMPAT_SSAS_MODE -SsmsMajor $env:COMPAT_SSMS_MAJOR `
            -ReportPath "$env:ARTIFACT_DIRECTORY/compatibility-report.json" `
            -TestResultPath "$env:ARTIFACT_DIRECTORY/nunit-results.xml" `
            -DiagnosticsPath "$env:ARTIFACT_DIRECTORY/runner-diagnostics.json" `
            -SsmsInstallationReportPath "$env:ARTIFACT_DIRECTORY/ssms-installation/ssms-$env:COMPAT_SSMS_MAJOR-install.json" `
            -SsasInstallationReportPath "$env:ARTIFACT_DIRECTORY/sql-setup/ssas-install.json" `
            -LogDirectory "$env:ARTIFACT_DIRECTORY/model-build" -RequireExistingUtilityProbe

      - name: Capture SSAS provisioning diagnostics
        if: always() && inputs.scope != 'media-only' && steps.verify-ssas.outcome != 'success'
        shell: powershell
        run: |
          ./test/infrastructure/Get-SsasProvisioningDiagnostics.ps1 `
            -OutputPath "$env:ARTIFACT_DIRECTORY/sql-setup/runner-provisioning-diagnostics.json"

      - name: Dismount installation media
        if: always() && steps.acquire-media.outcome == 'success'
        shell: powershell
        env:
          ISO_PATH: ${{ steps.acquire-media.outputs.iso-path }}
        run: |
          $image = Get-DiskImage -ImagePath $env:ISO_PATH -ErrorAction Stop
          if ($image.Attached) { Dismount-DiskImage -ImagePath $env:ISO_PATH -ErrorAction Stop }
          Remove-Item -LiteralPath $env:ISO_PATH -Force -ErrorAction Stop

      - name: Upload SQL setup logs, reports and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssas-${{ matrix.ssas_version }}-${{ matrix.mode }}-ssms-${{ matrix.ssms_major }}
          path: ${{ env.ARTIFACT_DIRECTORY }}
          if-no-files-found: warn
          retention-days: 30
