name: Release

# Publishes DeployCube to the PowerShell Gallery when a v* tag is pushed.
# Publishing only happens after the same validation gate as CI (PSScriptAnalyzer + Pester unit tests on
# Windows PowerShell 5.1) and the tag/manifest checks have passed. Live SSAS integration tests are not part of
# the release gate because hosted runners have no Analysis Services; run them beforehand via the CI workflow.

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  check-version:
    name: Check tag and manifest
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match manifest version
        run: |
          $manifest = Test-ModuleManifest -Path ./DeployCube/DeployCube.psd1 -ErrorAction Stop
          $expectedVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ("$($manifest.Version)" -ne $expectedVersion) {
            throw "Tag version '$expectedVersion' does not match manifest version '$($manifest.Version)'."
          }
          Write-Host "Releasing DeployCube $($manifest.Version)"

  publish:
    name: Publish to PowerShell Gallery
    needs: [validate, check-version]
    runs-on: windows-latest
    timeout-minutes: 20
    # Configure required reviewers and the PSGALLERY_API_KEY secret on this environment.
    environment: psgallery
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish module to PSGallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            throw 'The PSGALLERY_API_KEY secret is not configured for the psgallery environment.'
          }
          Publish-Module -Path ./DeployCube -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
