name: SSMS compatibility

on:
  push:
    branches:
      - feature/ssms-ssas-compatibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssms-version:
    name: SSMS ${{ matrix.ssms }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ssms: ['20', '21', '22']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Capture runner diagnostics
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path artifacts/ssms/${{ matrix.ssms }} -Force | Out-Null
          ./test/infrastructure/Get-RunnerDiagnostics.ps1 -OutputPath artifacts/ssms/${{ matrix.ssms }}/runner-diagnostics.json

      - name: Install SSMS ${{ matrix.ssms }}
        id: install
        shell: powershell
        run: |
          ./test/infrastructure/Install-Ssms.ps1 `
            -SsmsMajor '${{ matrix.ssms }}' `
            -LogDirectory 'artifacts/ssms/${{ matrix.ssms }}/installation' `
            -MinimumFreeSpaceGB 8

      - name: Test DeployCube discovery and selection
        if: always() && steps.install.outcome == 'success'
        shell: powershell
        run: |
          ./test/infrastructure/Invoke-SsmsCompatibility.ps1 `
            -SsmsMajor '${{ matrix.ssms }}' `
            -ReportPath 'artifacts/ssms/${{ matrix.ssms }}/compatibility-report.json' `
            -TestResultPath 'artifacts/ssms/${{ matrix.ssms }}/nunit-results.xml' `
            -DiagnosticsPath 'artifacts/ssms/${{ matrix.ssms }}/runner-diagnostics.json' `
            -InstallationReportPath 'artifacts/ssms/${{ matrix.ssms }}/installation/ssms-${{ matrix.ssms }}-install.json'

      - name: Record skipped tests after installation failure
        if: always() && steps.install.outcome == 'failure'
        shell: powershell
        run: |
          ./test/infrastructure/Write-SsmsInstallationFailureReport.ps1 `
            -SsmsMajor '${{ matrix.ssms }}' `
            -InstallationFailurePath 'artifacts/ssms/${{ matrix.ssms }}/installation/ssms-${{ matrix.ssms }}-install-failure.json' `
            -DiagnosticsPath 'artifacts/ssms/${{ matrix.ssms }}/runner-diagnostics.json' `
            -ReportPath 'artifacts/ssms/${{ matrix.ssms }}/compatibility-report.json'

      - name: Upload installer logs, inventory and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssms-${{ matrix.ssms }}-compatibility
          path: artifacts/ssms/${{ matrix.ssms }}
          if-no-files-found: warn
          retention-days: 30
